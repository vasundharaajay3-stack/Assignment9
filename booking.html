
<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>IPL Ticket Booking</h1>
</header>

<main>
    <h2>Book Your Tickets</h2>

    <form id="bookingForm">

        <label>Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <span id="nameError" class="error"></span>

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email">

        <label>Phone Number:</label>
        <input type="text" id="phone" placeholder="Enter 10 digit phone number">

        <label>Venue:</label>
        <select id="venue">
            <option value="">Select Venue</option>
            <option value="Chinnaswamy Stadium">Chinnaswamy Stadium</option>
            <option value="Chennai">Chennai</option>
        </select>
        <span id="venueError" class="error"></span>

        <label>Ticket Quantity:</label>
        <input type="number" id="quantity" value="1" min="1" max="10">
        <span id="quantityError" class="error"></span>

        <button type="submit" class="btn">Book Ticket</button>

    </form>

    <p id="success"></p>

    <br>
    <a href="matches.html">Back to Matches</a>
</main>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let venue = document.getElementById("venue").value;
    let quantity = Number(document.getElementById("quantity").value);

    let valid = true;

    document.getElementById("nameError").innerText = "";
    document.getElementById("venueError").innerText = "";
    document.getElementById("quantityError").innerText = "";
    document.getElementById("success").innerText = "";

    if (name === "") {
        document.getElementById("nameError").innerText = "Name is required";
        valid = false;
    }
    else if (name.length < 3) {
        document.getElementById("nameError").innerText = "Name must contain at least 3 characters";
        valid = false;
    }

    if (venue === "") {
        document.getElementById("venueError").innerText = "Please select a venue";
        valid = false;
    }

    if (quantity < 1 || quantity > 10 || !Number.isInteger(quantity)) {
        document.getElementById("quantityError").innerText = "Ticket quantity must be between 1 and 10";
        valid = false;
    }

    if (valid) {
        document.getElementById("success").innerText =
            "Booking Successful! Thank you, " + name + ".";
        alert("Ticket booked successfully!");
    }

});
</script>

</body>
</html>
